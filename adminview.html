<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAINS Dinner - Admin Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #800000;
      text-align: center;
    }
    h1 {
      color: #ff4d4d;
      margin-bottom: 5px;
      font-size: 22px;
    }
    p {
      color: #aaaaaa;
      font-size: 13px;
    }
    #reader {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #333;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      text-align: left;
    }
    .success {
      background-color: #1b4332;
      border: 1px solid #2d6a4f;
      color: #d8f3dc;
    }
    .warning {
      background-color: #5c3d11;
      border: 1px solid #855314;
      color: #ffe8cc;
    }
    .error {
      background-color: #4a1212;
      border: 1px solid #7a1c1c;
      color: #ffcdd2;
    }
    .result-box h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    .info-row {
      margin: 6px 0;
      font-size: 14px;
    }
    .badge-table {
      display: inline-block;
      background: #800000;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 5px;
    }
    .btn {
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #800000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 15px;
    }
    .btn:hover {
      background-color: #a00000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SAINS Admin QR Scanner</h1>
    <p>Scan guest QR code to register attendance</p>

    <div id="reader"></div>
    <div id="result" class="result-box"></div>

    <button id="reset-btn" class="btn" onclick="resetScanner()" style="display:none;">Scan Next Guest</button>
  </div>

  <script>
    // YOUR DEPLOYED GOOGLE APPS SCRIPT EXEC URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVU3KaCE1h4rHJky3qOeollVDUiELpMLHh8oWtrpGBAo6qBJP-p7nnQ9QEkkAkJMyKog/exec";

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      // Stop scanner while processing
      html5QrcodeScanner.clear();

      const resultDiv = document.getElementById("result");
      resultDiv.className = "result-box";
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "<p>⏳ Updating Google Sheet attendance...</p>";

      // Send HTTP GET request to Google Apps Script
      const targetUrl = `${SCRIPT_URL}?data=${encodeURIComponent(decodedText)}&t=${new Date().getTime()}`;

      fetch(targetUrl, {
        method: "GET",
        redirect: "follow"
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("reset-btn").style.display = "block";

        if (data.status === "success") {
          resultDiv.className = "result-box success";
          resultDiv.innerHTML = `
            <h3>✅ ${data.message}</h3>
            <div class="info-row"><strong>Name:</strong> ${data.name}</div>
            <div class="info-row"><strong>Rank/Dept:</strong> ${data.rank || '-'} (${data.dept || '-'})</div>
            <div class="info-row"><span class="badge-table">TABLE ${data.table}</span></div>
            <div class="info-row" style="margin-top: 10px; font-size: 11px; opacity: 0.8;">
              Status: Checked-In | Time: ${data.checkInTime}
            </div>
          `;
        } else if (data.status === "warning") {
          resultDiv.className = "result-box warning";
          resultDiv.innerHTML = `
            <h3>⚠️ ${data.message}</h3>
            <div class="info-row"><strong>Name:</strong> ${data.name}</div>
            <div class="info-row"><span class="badge-table">TABLE ${data.table}</span></div>
            <div class="info-row" style="margin-top: 10px; font-size: 11px;">
              Check-in Time: ${data.checkInTime || 'Previously recorded'}
            </div>
          `;
        } else {
          resultDiv.className = "result-box error";
          resultDiv.innerHTML = `<h3>❌ Error</h3><p>${data.message || 'Unknown server error'}</p>`;
        }
      })
      .catch(error => {
        console.error("Fetch Error:", error);
        document.getElementById("reset-btn").style.display = "block";
        resultDiv.className = "result-box error";
        resultDiv.innerHTML = `<h3>❌ Connection Failed</h3><p>Could not update Google Sheet. Verify internet connection.</p>`;
      });
    }

    function resetScanner() {
      isProcessing = false;
      document.getElementById("result").style.display = "none";
      document.getElementById("reset-btn").style.display = "none";
      html5QrcodeScanner.render(onScanSuccess);
    }

    // Initialize scanner
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
