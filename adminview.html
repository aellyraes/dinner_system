<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; margin: 0 auto; border: 1px solid #334155; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 2px solid #334155; }
        .info-box { background-color: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: left; }
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .value { font-size: 16px; color: #ffffff; font-weight: bold; }
        .btn-attend { background: #10b981; color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-reset { background: #475569; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="color: #38bdf8;">Admin Attendance Scanner</h2>

    <div id="scannerSection">
        <p style="color: #94a3b8;">Arahkan kamera ke QR tiket tetamu</p>
        <div id="reader"></div>
    </div>

    <div id="detailsCard" class="card" style="display: none;">
        <h3 id="guestName" style="margin-top:0; color:#38bdf8;">-</h3>
        
        <div class="info-box">
            <div class="label">Pangkat / Designation</div>
            <div class="value" id="guestRank">-</div>
        </div>

        <div class="info-box">
            <div class="label">Department</div>
            <div class="value" id="guestDept">-</div>
        </div>

        <div class="info-box" style="background:#2563eb; text-align:center;">
            <div class="label" style="color:#e0e7ff;">Table Number</div>
            <div class="value" id="guestTable" style="font-size:28px;">-</div>
        </div>

        <button class="btn-attend" id="btnConfirm" onclick="confirmAttendance()">✓ Confirm Attend</button>
        <button class="btn-reset" onclick="resetScanner()">Scan Next Guest</button>
    </div>

    <script>
        let html5QrCode;
        let selectedRow = null;

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => console.error("Camera error:", err));
        }

        function onScanSuccess(decodedText) {
            if (!decodedText.includes("ROW:")) {
                alert("QR Code ini tidak sah!");
                return;
            }

            html5QrCode.stop();
            document.getElementById('scannerSection').style.display = 'none';
            document.getElementById('detailsCard').style.display = 'block';

            // Parse text QR Code (ROW:x|NAME:x|RANK:x|DEPT:x|TABLE:x)
            const parts = decodedText.split('|');
            parts.forEach(part => {
                const [key, val] = part.split(':');
                if (key === 'ROW') selectedRow = val;
                if (key === 'NAME') document.getElementById('guestName').textContent = val;
                if (key === 'RANK') document.getElementById('guestRank').textContent = val;
                if (key === 'DEPT') document.getElementById('guestDept').textContent = val;
                if (key === 'TABLE') document.getElementById('guestTable').textContent = `TABLE ${val}`;
            });
        }

        function confirmAttendance() {
            if (!selectedRow) return;
            
            const btn = document.getElementById('btnConfirm');
            btn.textContent = "Updating Sheet...";
            btn.disabled = true;

            const webAppUrl = `https://script.google.com/macros/s/AKfycbzntQuKo2sIYhWwiPxmDjViK6qfdiKpK1_PGlx19SOXoRVmQ7-3PBn5LHtsswPlL2VXkQ/exec?row=${selectedRow}`;

            fetch(webAppUrl, { mode: 'no-cors' })
                .then(() => {
                    btn.textContent = "✓ Attendance Saved!";
                    btn.style.background = "#059669";
                })
                .catch(() => {
                    alert("Error updating attendance.");
                    btn.disabled = false;
                    btn.textContent = "✓ Confirm Attend";
                });
        }

        function resetScanner() {
            document.getElementById('detailsCard').style.display = 'none';
            document.getElementById('scannerSection').style.display = 'block';
            document.getElementById('btnConfirm').disabled = false;
            document.getElementById('btnConfirm').style.background = "#10b981";
            document.getElementById('btnConfirm').textContent = "✓ Confirm Attend";
            startScanner();
        }

        startScanner();
    </script>
</body>
</html>
