<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAINS Dinner - Admin Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --primary: #800000;
      --primary-hover: #990000;
      --accent-gold: #c5a059;
      --text-main: #ffffff;
      --text-sub: #c5c6c7;
      --success-bg: #0f3822;
      --success-border: #1f6f43;
      --warning-bg: #3d2c06;
      --warning-border: #7a580c;
      --error-bg: #380f0f;
      --error-border: #6f1f1f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(197, 160, 89, 0.25);
      text-align: center;
    }

    .header {
      margin-bottom: 20px;
    }

    .header-tag {
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      color: var(--text-main);
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .scanner-wrapper {
      position: relative;
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(197, 160, 89, 0.4);
      background: #000;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      object-fit: cover;
    }

    .result-card {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      display: none;
      text-align: left;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #72f2a2;
    }

    .warning {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #ffd166;
    }

    .error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #ff8585;
    }

    .guest-name {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .info-line {
      font-size: 13px;
      color: var(--text-sub);
      margin: 4px 0;
      line-height: 1.4;
    }

    .time-stamp {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn {
      margin-top: 20px;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    /* Adjust html5-qrcode standard elements */
    #reader__scan_region {
      background: #000;
    }
    #reader button {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      margin: 10px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-tag">SAINS ANNUAL DINNER 2026</div>
      <h1>ATTENDANCE SCANNER</h1>
    </div>

    <div class="scanner-wrapper">
      <div id="reader"></div>
    </div>

    <div id="result" class="result-card"></div>

    <button id="reset-btn" class="btn" onclick="resetScanner()" style="display:none;">Scan Next Guest</button>
  </div>

  <script>
    // GOOGLE APPS SCRIPT WEB APP URL (EXEC ENDPOINT)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygLxLN_h9D6AOCyci8Fh9eq8CgqAGWY8CZsO5v4QRNKumFuTMzxCUFHjcTNR1zks_U/exec";

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 15, 
      qrbox: { width: 220, height: 220 },
      aspectRatio: 1.0
    });
    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      // Hentikan seketika kamera
      html5QrcodeScanner.clear();

      const resultDiv = document.getElementById("result");
      resultDiv.className = "result-card";
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="info-line" style="text-align: center;">Verifying pass details...</div>`;

      const targetUrl = `${SCRIPT_URL}?data=${encodeURIComponent(decodedText)}&t=${new Date().getTime()}`;

      fetch(targetUrl, {
        method: "GET",
        redirect: "follow"
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("reset-btn").style.display = "block";

        if (data.status === "success") {
          resultDiv.className = "result-card success";
          resultDiv.innerHTML = `
            <div class="status-badge">VALID PASS - CHECKED IN</div>
            <div class="guest-name">${data.name}</div>
            <div class="info-line"><strong>Designation:</strong> ${data.rank || '-'}</div>
            <div class="info-line"><strong>Agency/Dept:</strong> ${data.dept || '-'}</div>
            <div class="time-stamp">RECORDED AT: ${data.checkInTime}</div>
          `;
        } else if (data.status === "warning") {
          resultDiv.className = "result-card warning";
          resultDiv.innerHTML = `
            <div class="status-badge">ALREADY CHECKED IN</div>
            <div class="guest-name">${data.name}</div>
            <div class="info-line"><strong>Designation:</strong> ${data.rank || '-'}</div>
            <div class="info-line"><strong>Agency/Dept:</strong> ${data.dept || '-'}</div>
            <div class="time-stamp">INITIAL CHECK-IN: ${data.checkInTime || 'RECORDED'}</div>
          `;
        } else {
          resultDiv.className = "result-card error";
          resultDiv.innerHTML = `
            <div class="status-badge">INVALID PASS</div>
            <div class="info-line">${data.message || 'System error encountered'}</div>
          `;
        }
      })
      .catch(error => {
        console.error("Fetch Error:", error);
        document.getElementById("reset-btn").style.display = "block";
        resultDiv.className = "result-card error";
        resultDiv.innerHTML = `
          <div class="status-badge">CONNECTION ERROR</div>
          <div class="info-line">Could not connect to database. Please check connectivity.</div>
        `;
      });
    }

    function resetScanner() {
      isProcessing = false;
      document.getElementById("result").style.display = "none";
      document.getElementById("reset-btn").style.display = "none";
      html5QrcodeScanner.render(onScanSuccess);
    }

    // Papar scanner
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
