<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Seating Details</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 32px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .header-tag {
            color: #38bdf8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .name {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .info-group {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #1e293b;
            text-align: left;
        }
        .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .value {
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 600;
        }
        .table-badge {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-top: 20px;
        }
        .table-number {
            font-size: 34px;
            font-weight: 900;
        }
        .btn-attend {
            background: #10b981;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-attend:active { background: #059669; }
        .btn-back {
            display: inline-block;
            background: #475569;
            color: white;
            text-decoration: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 10px;
        }
        #statusMsg {
            font-size: 14px;
            font-weight: bold;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-tag">Company Annual Dinner</div>
    <div class="name" id="guestName">Loading Guest...</div>
    
    <div class="info-group">
        <div class="label">Pangkat / Designation</div>
        <div class="value" id="guestRank">-</div>
    </div>
    
    <div class="info-group">
        <div class="label">Department</div>
        <div class="value" id="guestDept">-</div>
    </div>
    
    <div class="table-badge">
        <div class="table-number" id="guestTable">TABLE --</div>
    </div>

    <button class="btn-attend" id="attendBtn" onclick="confirmAttendance()">✓ Confirm Attend</button>
    <div id="statusMsg"></div>
    <a href="adminview.html" class="btn-back">Scan Next Guest</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    const name = params.get('name');
    const rank = params.get('rank');
    const dept = params.get('dept');
    const table = params.get('table');
    const row = params.get('row');
    const webAppUrl = params.get('webApp');

    document.getElementById('guestName').textContent = name ? decodeURIComponent(name) : 'Guest Not Found';
    document.getElementById('guestRank').textContent = rank ? decodeURIComponent(rank) : '-';
    document.getElementById('guestDept').textContent = dept ? decodeURIComponent(dept) : '-';
    document.getElementById('guestTable').textContent = table ? decodeURIComponent(table) : 'N/A';

    function confirmAttendance() {
        if (!row || !webAppUrl) {
            alert("Missing check-in parameters!");
            return;
        }

        document.getElementById("statusMsg").style.color = "#38bdf8";
        document.getElementById("statusMsg").textContent = "Updating Google Sheet...";

        fetch(`${decodeURIComponent(webAppUrl)}?action=checkin&row=${row}`)
            .then(res => res.text())
            .then(data => {
                document.getElementById("statusMsg").style.color = "#10b981";
                document.getElementById("statusMsg").textContent = "✓ Status & Check-In Time Updated!";
                document.getElementById("attendBtn").style.display = "none";
            })
            .catch(err => {
                document.getElementById("statusMsg").style.color = "#ef4444";
                document.getElementById("statusMsg").textContent = "Error updating Google Sheet.";
            });
    }
</script>

</body>
</html>
